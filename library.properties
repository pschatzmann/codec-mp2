name=TinyMP2
version=1.0.0
author=Phil Schatzmann
maintainer=Phil Schatzmann
sentence=Header-only MPEG-1 Layer II (MP2) audio decoder for microcontrollers.
paragraph=Decodes MPEG-1 Layer II ("MP2") frames to 16-bit PCM. No dynamic allocation: the whole decoder is a single fixed-size object you keep static/global, so RAM use is fixed and known at compile time (~14 KB). Suitable for ESP32, ESP8266, RP2040, SAMD21/51, STM32F4+, Teensy and similar 32-bit boards with enough free RAM; not for classic 8-bit AVR.
